name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Project Files
        run: |
          # If the android project folder isn't in Git, generate it dynamically
          if [ ! -d "android" ]; then
            echo "Android directory not found. Re-generating Flutter project structure..."
            flutter create --org com.vinay.breathtrack --project-name breathtrack .
          fi

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Inject Android Sensor Permissions
        run: |
          # Add the HIGH_SAMPLING_RATE_SENSORS permission if it doesn't already exist in AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "HIGH_SAMPLING_RATE_SENSORS" "$MANIFEST_PATH"; then
              echo "Injecting sensor permission into $MANIFEST_PATH..."
              # Inserts the uses-permission tag directly below the <manifest> tag
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />' "$MANIFEST_PATH"
            fi
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64-v8a only)
        run: flutter build apk --target-platform android-arm64 --release

      - name: Prepare APK Release Asset
        run: |
          # Get current date and time in Indian Standard Time (IST)
          IST_DATE_12=$(TZ="Asia/Kolkata" date +'%b%d-%I%M%p-IST')
          IST_DATE_24=$(TZ="Asia/Kolkata" date +'%b%d-%H%M-IST')
          
          echo "IST_DATE_12=$IST_DATE_12" >> $GITHUB_ENV
          echo "IST_DATE_24=$IST_DATE_24" >> $GITHUB_ENV
          
          # Rename and copy the compiled APK to the root workspace
          cp build/app/outputs/flutter-apk/app-release.apk ./BreathTrack-$IST_DATE_12.apk
          echo "Renamed APK to BreathTrack-$IST_DATE_12.apk"

      - name: Publish Release on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Create the 'latest' release if it doesn't exist
          gh release view latest || gh release create latest --title "BreathTrack IST Build ($IST_DATE_24)" --notes "Latest BreathTrack APK build ($IST_DATE_12)."
          
          # 2. Update the release metadata
          gh release edit latest --title "BreathTrack IST Build ($IST_DATE_24)" --notes "Latest BreathTrack APK build ($IST_DATE_12)."
          
          # 3. Delete previous assets to keep the latest release clean (only holds the most recent build)
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            echo "Deleting old release asset: $asset..."
            gh release delete-asset latest "$asset" --yes
          done
          
          # 4. Upload the new timestamped APK
          gh release upload latest ./BreathTrack-$IST_DATE_12.apk --clobber
